# Media from an unknown number, seeded by run-media.sh. Shown at once by default
# (Settings, "Show media from unknown numbers"); off, each waits for a tap.
# Commands from https://docs.maestro.dev/reference/commands-available.
appId: com.yaz.sms.debug
---
- extendedWaitUntil:
    visible: "T-held-sound"
    timeout: 10000
- assertVisible:
    text: "Photo"
    above: "T-held-photo"
- assertNotVisible: "Photo from an unknown number, tap to show"
# The setting off: the same photo waits for a tap.
- tapOn: "Back"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Show media from unknown numbers"
    direction: DOWN
- tapOn: "Show media from unknown numbers"
- back
# An unknown sender lives in Archive > Unknown while screening is on.
- tapOn: "Archive"
- tapOn: "Unknown.*"
- tapOn: "\\+33 7 99 88 77 66"
- extendedWaitUntil:
    visible: "T-held-photo"
    timeout: 10000
- assertVisible:
    text: "Photo from an unknown number, tap to show"
    above: "T-held-photo"
- tapOn:
    text: "Photo from an unknown number, tap to show"
    above: "T-held-photo"
- assertVisible:
    text: "Photo"
    above: "T-held-photo"
# Back to the default.
- tapOn: "Back"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Show media from unknown numbers"
    direction: DOWN
- tapOn: "Show media from unknown numbers"
- back
