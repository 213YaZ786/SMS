<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src blob: mediastream:">
<title>Call</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { position: absolute; background: #000; }
  /* The other side's picture, full screen. */
  #remote { left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
  /* Our own camera, small and mirrored, inside it. */
  #local { right: 12px; top: 12px; width: 27%; max-height: 27%; object-fit: cover; border-radius: 12px; }
  #local.mirrored { transform: scaleX(-1); }
  .hidden { display: none; }
</style>
</head>
<body>
<video id="remote" autoplay playsinline></video>
<video id="local" class="hidden" autoplay playsinline muted></video>
<script src="call.js"></script>
</body>
</html>
