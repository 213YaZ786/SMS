<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing from anywhere: no request, no outside script, picture or style.
     Only this page's own script, and the call's media. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob: mediastream:; connect-src 'none'; img-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  video { position: absolute; background: transparent; }
  #remote { inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; }
  #remote.on { opacity: 1; }
  #self { right: 16px; top: 120px; width: 28vw; max-width: 160px; aspect-ratio: 3 / 4; object-fit: cover;
          border-radius: 20px; opacity: 0; transform: scaleX(-1); touch-action: none; transition: opacity .3s; }
  #self.on { opacity: 1; }
</style>
</head>
<body>
<video id="remote" autoplay playsinline></video>
<video id="self" autoplay playsinline muted></video>
<script>
'use strict';
// The encrypted call's media, WebRTC. Offer and answer go through the
// chat (the app hands them over); the page never reaches anything itself.
let pc = null, local = null, video = false, front = true, meterTimer = null;
const remote = document.getElementById('remote');
const self = document.getElementById('self');

function config(ice) {
  let servers = [];
  try { servers = JSON.parse(ice); } catch (e) {}
  return { iceServers: Array.isArray(servers) ? servers : [], bundlePolicy: 'max-bundle', rtcpMuxPolicy: 'require' };
}

async function media(withVideo) {
  const cam = withVideo ? { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } : false;
  try {
    local = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: cam
    });
  } catch (e) {
    // Some phones refuse the processed microphone: the plain one then.
    console.log('microphone with processing refused: ' + e);
    local = await navigator.mediaDevices.getUserMedia({ audio: true, video: cam });
  }
  if (withVideo) { self.srcObject = local; self.classList.add('on'); }
}

function wire() {
  pc.ontrack = (e) => {
    remote.srcObject = e.streams[0];
    if (video) remote.classList.add('on');
    meter(e.streams[0]);
  };
  pc.onconnectionstatechange = () => Native.state(pc.connectionState);
  local.getTracks().forEach((t) => pc.addTrack(t, local));
}

// No trickle: the whole description, candidates included, goes in one message.
function gathered() {
  return new Promise((done) => {
    if (pc.iceGatheringState === 'complete') return done();
    const timer = setTimeout(done, 6000);
    pc.onicegatheringstatechange = () => {
      if (pc.iceGatheringState === 'complete') { clearTimeout(timer); done(); }
    };
  });
}

async function call(ice, withVideo) {
  try {
    video = withVideo;
    pc = new RTCPeerConnection(config(ice));
    await media(withVideo);
    wire();
    await pc.setLocalDescription(await pc.createOffer());
    await gathered();
    Native.offer(pc.localDescription.sdp);
  } catch (e) { Native.error(String(e)); }
}

async function accepted(sdp) {
  try { await pc.setRemoteDescription({ type: 'answer', sdp: sdp }); } catch (e) { Native.error(String(e)); }
}

async function answer(ice, sdp, withVideo) {
  try {
    video = withVideo;
    pc = new RTCPeerConnection(config(ice));
    await media(withVideo);
    wire();
    await pc.setRemoteDescription({ type: 'offer', sdp: sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await gathered();
    Native.answer(pc.localDescription.sdp);
  } catch (e) { Native.error(String(e)); }
}

function mute(on) { if (local) local.getAudioTracks().forEach((t) => { t.enabled = !on; }); }

function camera(on) {
  if (!local) return;
  local.getVideoTracks().forEach((t) => { t.enabled = on; });
  self.classList.toggle('on', on);
}

async function flip() {
  try {
    front = !front;
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: front ? 'user' : 'environment' } });
    const track = s.getVideoTracks()[0];
    const sender = pc.getSenders().find((x) => x.track && x.track.kind === 'video');
    local.getVideoTracks().forEach((t) => { t.stop(); local.removeTrack(t); });
    local.addTrack(track);
    if (sender) await sender.replaceTrack(track);
    self.srcObject = local;
    self.style.transform = front ? 'scaleX(-1)' : 'none';
  } catch (e) { Native.error(String(e)); }
}

function hangup() {
  if (meterTimer) clearInterval(meterTimer);
  if (pc) pc.close();
  if (local) local.getTracks().forEach((t) => t.stop());
  pc = null; local = null;
}

// How loud the other side is, ten times a second, for the rings of the face.
function meter(stream) {
  try {
    const ctx = new AudioContext();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    ctx.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    meterTimer = setInterval(() => {
      analyser.getByteTimeDomainData(data);
      let peak = 0;
      for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
      Native.level(peak / 128);
    }, 100);
  } catch (e) {}
}

// The small picture of oneself goes wherever the finger puts it.
(() => {
  let dx = 0, dy = 0, dragging = false;
  self.addEventListener('pointerdown', (e) => {
    dragging = true; self.setPointerCapture(e.pointerId);
    const r = self.getBoundingClientRect(); dx = e.clientX - r.left; dy = e.clientY - r.top;
  });
  self.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const w = self.offsetWidth, h = self.offsetHeight;
    const x = Math.min(Math.max(8, e.clientX - dx), innerWidth - w - 8);
    const y = Math.min(Math.max(8, e.clientY - dy), innerHeight - h - 8);
    self.style.left = x + 'px'; self.style.top = y + 'px'; self.style.right = 'auto';
  });
  self.addEventListener('pointerup', () => { dragging = false; });
})();

Native.ready();
</script>
</body>
</html>
