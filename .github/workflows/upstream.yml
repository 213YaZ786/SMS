# Once a week: is there a newer version of what the app pins by hand
# (chatmail core)? If so, an issue says which, with what is needed to pin
# it. Nothing changes by itself: a new engine is tested before it reaches
# anyone. Libraries from
# Gradle are Dependabot's; lists the app fetches (dangerous sites, relays)
# refresh in the app itself.
name: Pinned engines

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare with the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue() {
            if gh issue list --state open --search "\"$1\" in:title" --json number -q '.[0].number' | grep -q .; then return; fi
            gh issue create --title "$1" --body "$2"
          }
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$2" ]; }

          # chatmail core: the encrypted chat's engine, two Android builds.
          pinned=$(grep -oP 'val chatmailVersion = "\K[0-9.]+' app/build.gradle.kts)
          latest=$(gh release view -R chatmail/core --json tagName -q .tagName | sed 's/^v//')
          echo "chatmail pinned $pinned, latest $latest"
          if newer "$pinned" "$latest"; then
            sums=""
            for abi in arm64-v8a armeabi-v7a; do
              name="deltachat-rpc-server-$abi-android"
              curl -fsSL -o "$name" "https://github.com/chatmail/core/releases/download/v$latest/$name"
              sums="$sums- $abi: \`$(sha256sum "$name" | cut -d' ' -f1)\`"$'\n'
            done
            issue "chatmail core $latest is out (the app uses $pinned)" \
              "Release notes: https://github.com/chatmail/core/releases/tag/v$latest"$'\n\n'"SHA-256 of the Android builds:"$'\n'"$sums"$'\n'"To try it: set chatmailVersion and these sums in app/build.gradle.kts, then test the encrypted chat before releasing."
          fi
